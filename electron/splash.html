<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Voxel Realms — Launching</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 480px;
        height: 270px;
        background: radial-gradient(circle at 50% 35%, #1e293b 0%, #090d16 100%);
        color: #f8fafc;
        font-family: 'Courier New', monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border: 2px solid #4ade80;
        user-select: none;
        overflow: hidden;
      }
      .cube-logo {
        width: 54px;
        height: 54px;
        background: linear-gradient(180deg, #4ade80 0%, #4ade80 40%, #854d0e 40%, #713f12 100%);
        border: 3px solid #f8fafc;
        box-shadow: 0 8px 24px rgba(74, 222, 128, 0.35);
        margin-bottom: 16px;
        animation: pulse 1.4s infinite ease-in-out;
      }
      h1 {
        font-size: 22px;
        letter-spacing: 0.08em;
        color: #4ade80;
        margin-bottom: 6px;
      }
      p {
        font-size: 12px;
        color: #94a3b8;
        margin-bottom: 18px;
      }
      .bar-track {
        width: 320px;
        height: 10px;
        background: #1e293b;
        border: 1px solid #475569;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        width: 45%;
        background: #4ade80;
        animation: slide 1.1s infinite linear;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(260%); }
      }
    </style>
  </head>
  <body>
    <div class="cube-logo"></div>
    <h1>VOXEL REALMS</h1>
    <p>Initializing WebGL Engine &amp; Meshing Workers...</p>
    <div class="bar-track"><div class="bar-fill"></div></div>
  </body>
</html>
